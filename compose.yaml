services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: task_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_user -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://database:5432/tasks
      DB_USER: task_user
      DB_PASSWORD: task_password
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
